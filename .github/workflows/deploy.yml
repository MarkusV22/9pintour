# Testet jede Änderung; veröffentlicht auf Cloudflare erst, wenn die Repository-Variable DEPLOY_ENABLED=true gesetzt ist.
# Für die Veröffentlichung benötigte Repository-Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, PASSWORD_PEPPER
# Optional: GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, RESEND_API_KEY, MAIL_FROM, IMPORT_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET
# Optionale Repository-Variable: APP_URL (z. B. https://9pintour.at nach der Umstellung)
name: Testen & Veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci && npm --prefix web ci
      - run: npm run typecheck && npm test
      - name: Frontend bauen
        run: npm run build

  deploy:
    needs: test
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci && npm --prefix web ci
      - name: Frontend bauen
        run: npm run build
      - name: Account-ID prüfen
        # Toleriert versehentlich mitkopierte Leerzeichen oder die ganze Dashboard-Adresse
        run: |
          ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr 'A-F' 'a-f' | grep -oE '[0-9a-f]{32}' | head -1 || true)
          if [ -z "$ID" ]; then echo "::error::CLOUDFLARE_ACCOUNT_ID enthält keine gültige Account-ID (32 Zeichen, 0-9 und a-f)."; exit 1; fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ID" >> "$GITHUB_ENV"
      - name: Cloudflare-Ressourcen vorbereiten
        run: node scripts/ci-provision.mjs
      - name: Datenbank-Schema aktualisieren
        run: npx wrangler d1 migrations apply 9pintour --remote
      - name: Veröffentlichen
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -n "$APP_URL" ]; then npx wrangler deploy --var "APP_URL:$APP_URL"; else npx wrangler deploy; fi
      - name: Secrets setzen
        env:
          PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          IMPORT_KEY: ${{ secrets.IMPORT_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          node scripts/ci-secrets.mjs "$RUNNER_TEMP/secrets.json"
          npx wrangler secret bulk "$RUNNER_TEMP/secrets.json"
          # Import-Seite sperren, sobald IMPORT_KEY in GitHub gelöscht ist
          if [ -z "$IMPORT_KEY" ]; then npx wrangler secret delete IMPORT_KEY 2>/dev/null <<< "y" || true; fi
          rm -f "$RUNNER_TEMP/secrets.json"
